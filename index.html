<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Skill Craft — Aprenda, desenvolva e prepare-se para o mercado</title>
    <meta
      name="description"
      content="Skill Craft: agência estudantil de apoio acadêmico, tecnológico e criativo. Apresentações, sites simples, revisão de trabalhos, resumos técnicos, artes e logotipos — com Administração, TI e Design integrados, além de ferramentas gratuitas de estudo."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#101B3D" />
    <meta name="author" content="Skill Craft" />
    <!-- canonical e og:url são injetados no build quando VITE_SITE_URL está definida -->
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skill Craft" />
    <meta property="og:title" content="Skill Craft — agência estudantil de apoio acadêmico" />
    <meta
      property="og:description"
      content="Aprenda, desenvolva e prepare-se para o mercado. Serviços acadêmicos com qualidade profissional em Administração, TI e Design, com preço de referência transparente."
    />
    <meta property="og:image" content="/brand/og-cover.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skill Craft — agência estudantil de apoio acadêmico" />
    <meta
      name="twitter:description"
      content="Apresentações, sites simples, revisão de trabalhos, resumos técnicos, artes e logotipos — com preço de referência e processo em cinco etapas."
    />
    <meta name="twitter:image" content="/brand/og-cover.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Skill Craft",
        "alternateName": "Skillscraft",
        "description": "Agência estudantil de apoio acadêmico, tecnológico e criativo, organizada em três áreas: Administração, Tecnologia da Informação e Design.",
        "slogan": "Aprenda, desenvolva e prepare-se para o mercado.",
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Criação de apresentações" },
            "priceSpecification": { "@type": "PriceSpecification", "price": "15.00", "priceCurrency": "BRL" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Criação de sites simples" },
            "priceSpecification": { "@type": "PriceSpecification", "price": "30.00", "priceCurrency": "BRL" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Revisão de trabalhos" },
            "priceSpecification": { "@type": "PriceSpecification", "price": "10.00", "priceCurrency": "BRL" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Resumos técnicos" },
            "priceSpecification": { "@type": "PriceSpecification", "price": "10.00", "priceCurrency": "BRL" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Criação de artes e logotipos" },
            "priceSpecification": { "@type": "PriceSpecification", "price": "15.00", "priceCurrency": "BRL" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
